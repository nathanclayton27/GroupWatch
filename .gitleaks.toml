# Secret gate: gitleaks defaults (which already cover Linear, Supabase,
# GitHub, and generic API-key shapes) plus an allowlist for the one
# credential that is public by design — the Supabase publishable key
# shipped in the page source.
[extend]
useDefault = true

[allowlist]
description = "Public-by-design values and catalog identifiers"
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]+''',
  # lowercase kebab-case slugs and row ids (hickman-secret-wars,
  # secret-warriors-28) trip the generic rule when a catalog rebuild
  # rewrites search.json's single line; no credential has this shape
  '''^[a-z0-9]+(?:[.-][a-z0-9]+)+$''',
]
